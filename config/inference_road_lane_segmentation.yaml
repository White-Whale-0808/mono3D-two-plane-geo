model:
  device: "cuda"
  model_name: "pidnet_l"
  weight_path: "pidnet_pretrained_model/PIDNet_L_Cityscapes_test.pt"
  # weight_path: "models/road_segmentation_best.pth"  # The original Resnet101 model is too slow and not accurate enough, so we switched to PIDNet_L 

input:
  image_path: "inference_datasets/carla_dataset_Town03_uphile/images/000300.png"
  image_batch_path: "inference_datasets/carla_dataset_Town03_uphile/images"
  resize_size:
    - 512
    - 1024

road_segmentation:
  # threshold: 0.5  # The original Resnet101 model is too slow and not accurate enough, so we switched to PIDNet_L 
  # mask_erosion_kernel: 3  # Erode mask inward by this many pixels to eliminate edge artifacts

line_segmentation:
  min_segment_length_near: 65  # Length threshold at the bottom of the image (near camera)
  min_segment_length_far: 0   # Length threshold at the top of the image (far / uphill); threshold is interpolated linearly between these two values based on segment mid-y

lane_segmentation:
  min_slope: 0.3
  # roi: 0.2
  lane_band_tolerance: 10  # Max x_at_bottom deviation (pixels) from innermost segment to still be considered the same lane marking
  track_bands: 16  # Horizontal bands for near-to-far continuity tracking (internally clamped to >= 16); independent of lane_fitting.num_bands

lane_fitting:
  num_samples: 80  # Fallback width-sample count: y-uniform legacy mode, or geometry mode when samples_per_meter is unset
  samples_per_meter: 6  # Geometry mode: width-sample density in pitch_estimation, per meter of visible depth (scene-invariant); inner-chain points are dense per-row and not affected

pitch_estimation:
  f_x: 512  # Focal length calculated from camera intrinsics and resize dimensions
  f_y: 455  # Correct for this dataset: captured at 1280x720 (fov90 -> f=640), resized to 1024x512 non-uniformly -> f_x=640*0.8=512, f_y=640*(512/720)=455
  # Inner-edge-to-inner-edge lane width (m). NOT carla's waypoint.lane_width (3.5),
  # which is boundary-CENTRE to boundary-CENTRE (verified 2026-07-31: the projected
  # 1.75 m line lands on the centre of the painted marking to within 9 mm, n=399).
  #
  # WARNING - 3.216 is a FITTED value, not the physical width. The physical
  # inner-to-inner is 3.25 m:
  #     left  (SolidSolid, double yellow): 1.75 - (0.125 + gap/2) = 1.5625
  #     right (Solid, single white):       1.75 -  0.125/2        = 1.6875
  # with the double-line gap measured at ~0.12-0.17 m (carla_module/project_lane_gt.py
  # + debug/measure_paint_edges.py; direct edge measurement gives 3.25-3.27 m).
  # Note the two sides are ASYMMETRIC about the lane centre - only the SPACING
  # enters the model, never the absolute positions.
  #
  # 3.245 was A/B tested on 2026-07-31 and made things WORSE:
  #     3.216 -> profile MAE mean 0.2331 / median 0.1845
  #     3.245 -> profile MAE mean 0.2492 / median 0.2085  (388 of 451 frames worse)
  # w_real is a pure scale factor: z -> (1+d)z and Y -> (1+d)Y, so dY/dz and every
  # pitch VALUE are unchanged; only the z-axis labelling shifts. The MAE change is
  # therefore pure z-axis misalignment against GT, and 3.216 is currently absorbing
  # a GT-side systematic (prime suspect: collect_dist_m is 3D arc length while the
  # pipeline's z is depth - 2.2% apart on a 12 deg slope). See to-do.md.
  #
  # DO NOT change this to 3.25 until the GT distance axis is fixed (to-do groups
  # 2 and 3). Doing it alone breaks the error cancellation, exactly like the
  # w_real / camera-offset pair in WWH-11.
  w_real: 3.216
  camera_height: 1.08  # Camera mount height above road (m): CAMERA_HEIGHT in carla_module/get_carlaDataset.py (the dataset collector). NOTE realtime_test.py mounts its camera at 2.4 m and overrides this. Used to derive lane_segmentation thresholds from projection geometry.
  camera_forward_offset: 1.5  # Camera mount offset AHEAD of the vehicle origin (m): the x of carla.Transform(carla.Location(x=1.5, z=CAMERA_HEIGHT)) in get_carlaDataset.py. measurements.csv records collect_dist_m / gt_pitch_deg at the VEHICLE origin, so GT lookups for a point at camera depth z must use vehicle distance z + this offset.
  method: windowed  # Pitch estimator: "windowed" (local z-window Theil-Sen, explicit spatial resolution) or "spline" (global weighted UnivariateSpline)

visualization:
  alpha: 0.4
  save_path: "outputs/result.png"

csv_io:
  input_dir: "inference_datasets/carla_dataset_Town03_uphile/measurements.csv"
  output_dir: "outputs/measurements.csv"
  measurements_csv: "inference_datasets/carla_dataset_Town03_uphile/measurements.csv"
  problem_csv: "outputs/problem.csv"  # Frames with profile_mae above problem_mae_threshold, sorted worst-first
  problem_mae_threshold: 2.0  # Degrees; frames above this are flagged in problem_csv